# kitty config: clean & minimal, Halo CE palette (see ~/arch-journal/profile.md)
# All options: /usr/share/doc/kitty/kitty.conf   Reload: CTRL+SHIFT+F5

# --- Font ---
font_family      JetBrainsMono Nerd Font Mono
font_size        9.0

# --- Window ---
window_padding_width 6
confirm_os_window_close 0
enable_audio_bell no

# --- Cursor ---
cursor_shape beam
cursor_blink_interval 0

# --- Colors: black background, Halo CE accents ---
background            #000000
foreground            #dddddd
cursor                #5ab4e5
cursor_text_color     #000000
selection_background  #12304a
selection_foreground  #ffffff
url_color             #8fd6ff

# The 16 terminal colors programs use (normal 0-7, bright 8-15)
# black
color0  #1a1a1a
color8  #666666
# red: shield-depleted warning
color1  #e55a5a
color9  #ff7b7b
# green
color2  #6fcf97
color10 #8fe3b0
# yellow
color3  #e5c35a
color11 #f2d98a
# blue: steel / HUD
color4  #2d6a9f
color12 #5ab4e5
# magenta: Covenant purple
color5  #b48ee5
color13 #cdb0f2
# cyan: shield glow
color6  #5ae5d6
color14 #8fd6ff
# white
color7  #dddddd
color15 #ffffff
