# spotify-launcher: shared (not themed). Linked from ~/.config/spotify-launcher.conf.
# Example with all options: /etc/spotify-launcher.conf
# Test what it would run: spotify-launcher -v --skip-update --no-exec
[spotify]
# Run Spotify (Chromium) natively on Wayland: sharp at monitor scale 1.25.
# Through XWayland it was blurry (and xwayland.force_zero_scaling would make it tiny instead).
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
