# hypridle: what happens when you stop using the PC.
# Based on /usr/share/hypr/hypridle.conf. Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle
# Each listener runs on-timeout after N seconds idle, and on-resume when you come back.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # lock, but never start two lock screens
    before_sleep_cmd = loginctl lock-session                          # lock before suspend (e.g. closing the lid)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen back on after resume
}

# 2.5 min: dim the screen (-s saves the current level, -r restores it)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2.5 min: keyboard light off (this laptop's device is platform::kbd_backlight)
listener {
    timeout = 150
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Auto-suspend after 30 min is in the sample config but left out on purpose:
# suspend with the NVIDIA driver hasn't been tested on this machine yet.
