<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Imperial theme, mode 3 ("crazy"): put Aurebesh in front of EVERY font request,
  so GTK/Qt apps, Firefox and anything else using fontconfig draws in Aurebesh.
  Characters Aurebesh doesn't have (icons, emoji, accents) fall back to the font the app asked for.
  `sw-mode 3` links this into ~/.config/fontconfig/conf.d/, `sw-mode 1|2` removes the link.
  Apps read it when they start, so restart them to see the change.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="prepend" binding="strong">
      <string>Aurebesh</string>
    </edit>
  </match>
</fontconfig>
