# bluetui colors: Halo CE menu (palette from yazi/theme.toml). Loaded on top of
# kitty.conf by bin/comlink. bluetui has no color settings; it draws with these terminal slots:
#   color2 = focused panel frame + title   color3 = column headers
#   color8 = selected row (background)     color15 = selected row (text)
#   color4 = help line                     foreground = text + unfocused frame
# Background stays kitty's black, like yazi.
foreground  #8fa9cc
# frame blue = focus and selection (navy text on it), cyan headers
color2  #2f8cff
color3  #7fe3ff
color8  #2f8cff
color15 #03091a
color4  #4da3ff
# thin dark text on the bright selection bar renders washed out: heavier gamma + contrast fixes it
text_composition_strategy 1.7 30
