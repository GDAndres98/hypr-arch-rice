# hyprlock: lock screen, Halo CE menu look (after halo-ce-latam-audio's design system)
# Built like the original Xbox "CONTROLLER CONFIGURATION" pop-up:
# navy panel, bright blue rounded frame with glow, title band over a rule.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock
# Colors: rgba(RRGGBBAA). Positions: x,y from the center, y goes UP. Clear typed password: ESC or Ctrl+U.
# Escape # in text as ##.

$title = Michroma
$font  = Saira

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Space navy, no image
background {
    monitor =
    color = rgba(03091aff)
}

# The panel: translucent navy, 2px frame blue, rounded 10, soft blue glow
shape {
    monitor =
    size = 460, 320
    color = rgba(061230e6)
    rounding = 10
    border_size = 2
    border_color = rgba(2f8cffff)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(2f8cff66)

    position = 0, 10
    halign = center
    valign = center
}

# Title band: wide uppercase blue words over a rule across the panel
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgba(4da3ffff)
    font_size = 13
    font_family = $title

    position = 0, 135
    halign = center
    valign = center
}

shape {
    monitor =
    size = 456, 1
    color = rgba(1d4e8fff)
    rounding = 0

    position = 0, 113
    halign = center
    valign = center
}

# Time: big, wide, menu blue
label {
    monitor =
    text = $TIME
    color = rgba(4da3ffff)
    font_size = 48
    font_family = $title

    position = 0, 55
    halign = center
    valign = center
}

# Date: uppercase (%^A = day name in capitals), muted
label {
    monitor =
    text = cmd[update:60000] date +"%^A %d %^B"
    color = rgba(8fa9ccff)
    font_size = 12
    font_family = $font

    position = 0, 0
    halign = center
    valign = center
}

# Password box: a framed control. Cyan while checking, coral on a wrong password.
input-field {
    monitor =
    size = 300, 42
    outline_thickness = 2
    rounding = 8
    inner_color = rgba(020818ff)   # well
    outer_color = rgba(2f8cffff)   # frame
    check_color = rgba(7fe3ffff)   # cyan
    fail_color  = rgba(ff8f80ff)   # coral
    font_color  = rgba(dce9f8ff)   # near-white
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##4da3ff">ENTER PASSWORD</span>
    fail_text = <span foreground="##ff8f80">$PAMFAIL</span>
    dots_spacing = 0.3

    position = 0, -65
    halign = center
    valign = center
}

# Prompt line, like "PRESS START OR (A) TO CONTINUE"
label {
    monitor =
    text = PRESS ENTER TO CONTINUE
    color = rgba(dce9f8ff)
    font_size = 9
    font_family = $font

    position = 0, -118
    halign = center
    valign = center
}
