# hyprlock: Halo CE lock screen. The ring-world wallpaper with a clean HUD column in the middle:
# big time, date, a framed password well, and the "press start" prompt of the Xbox menus.
# Wallpaper: ../wallpaper/ring.py (SVG -> PNG with rsvg-convert).
# Test it while another theme is active:  hyprlock -c ~/dotfiles/themes/halo-ce/hypr/hyprlock.conf
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock
# Colors: rgba(RRGGBBAA). Positions: x,y from the anchor (halign/valign), y goes UP. Escape # in text as ##.

$title = Michroma
$font  = Saira

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/dotfiles/themes/halo-ce/wallpaper/ring.png
    color = rgba(03091aff)   # shown if the image is missing
}

# Time: wide display face, near-white with a blue glow
label {
    monitor =
    text = $TIME
    color = rgba(dce9f8ff)
    font_size = 64
    font_family = $title
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(2f8cff88)

    position = 0, 90
    halign = center
    valign = center
}

# Date: uppercase (%^A = day name in capitals), menu blue
label {
    monitor =
    text = cmd[update:60000] date +"%^A  %d  %^B"
    color = rgba(4da3ffff)
    font_size = 12
    font_family = $title

    position = 0, 20
    halign = center
    valign = center
}

# Password: a framed well. Cyan while checking, coral on a wrong password, amber with Caps Lock.
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 2
    rounding = 8
    inner_color = rgba(061230cc)
    outer_color = rgba(2f8cffff)
    check_color = rgba(7fe3ffff)
    fail_color  = rgba(ff8f80ff)
    capslock_color = rgba(f2c25cff)
    font_color  = rgba(dce9f8ff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##4da3ff">ENTER PASSWORD</span>
    fail_text = <span foreground="##ff8f80">$PAMFAIL</span>
    dots_spacing = 0.3
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(2f8cff55)

    position = 0, -50
    halign = center
    valign = center
}

# Prompt line, like "PRESS START OR (A) TO CONTINUE"
label {
    monitor =
    text = PRESS ENTER TO CONTINUE
    color = rgba(dce9f8cc)
    font_size = 9
    font_family = $font

    position = 0, -100
    halign = center
    valign = center
}
