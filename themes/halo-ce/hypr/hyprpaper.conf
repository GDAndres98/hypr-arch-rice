# Halo CE wallpaper: a ring world in space (made by ../wallpaper/ring.py)
# hyprpaper 0.8 syntax. Started at login (hyprland.lua) and by `theme`, only if the active theme has this file.
splash = false

wallpaper {
    monitor =             # empty = every monitor
    path = ~/dotfiles/themes/halo-ce/wallpaper/ring.png
    fit_mode = cover      # cover | contain | fill | tile
}
