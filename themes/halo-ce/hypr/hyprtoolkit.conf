# Halo CE: hyprtoolkit look, for Hyprland's own small apps (hyprland-run, dialogs from hyprland-guiutils).
# Linked from ~/.config/hypr/hyprtoolkit.conf through `current`.
# Colors: rgba(RRGGBBAA). The app finder on SUPER + R is rofi now: see rofi/config.rasi.

background       = rgba(03091acc)   # space navy, 80%
base             = rgba(061230d9)   # search box
alternate_base   = rgba(0b1d45cc)
text             = rgba(dce9f8ff)
bright_text      = rgba(9ad6ffff)   # HUD cyan
link_text        = rgba(4ab4ffff)
accent           = rgba(2f8cffff)   # selected row: shield blue
accent_secondary = rgba(fff27aff)   # Warthog yellow

font_family           = Saira
font_family_monospace = JetBrainsMono Nerd Font
font_size       = 13
small_font_size = 10
h1_size = 22
h2_size = 17
h3_size = 14

rounding_large = 0   # HUD panels have square corners
rounding_small = 0
